name: Windows build and installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scannerArchive = Join-Path $env:RUNNER_TEMP 'gitleaks.zip'
          $scannerDirectory = Join-Path $env:RUNNER_TEMP 'gitleaks'
          Invoke-WebRequest 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' -OutFile $scannerArchive
          if ((Get-FileHash -LiteralPath $scannerArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e') { throw 'Secret scanner checksum mismatch' }
          Expand-Archive -LiteralPath $scannerArchive -DestinationPath $scannerDirectory
          & (Join-Path $scannerDirectory 'gitleaks.exe') git . --redact --no-banner --log-opts=--all
          if ($LASTEXITCODE -ne 0) { throw 'Secret scan failed' }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.16.0'
          cache: npm
      - name: Select Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --no-self-update
      - name: Use pinned Rust
        run: rustup override set 1.99.0
      - run: npm ci
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "if(process.env.RELEASE_TAG !== 'v'+require('./package.json').version) throw Error('Release tag must match package.json version')"
      - run: npm run build
      - run: npm run check
      - run: npm run package
      - name: Verify packaged desktop without hardware
        run: npm run verify:release
      - run: npm run installer
      - name: Smoke install and uninstall without a driver or keyboard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem dist/installers/*-Setup.exe).FullName
          $target = Join-Path $env:RUNNER_TEMP 'OpenTKL-install-check'
          $install = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/TASKS="!controller,!desktopicon"',('/DIR="' + $target + '"')) -WindowStyle Hidden -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Setup failed: $($install.ExitCode)" }
          if (!(Test-Path -LiteralPath (Join-Path $target 'runtime/Function Elite OpenTKL.exe'))) { throw 'Installed application is missing' }
          $uninstall = Start-Process -FilePath (Join-Path $target 'unins000.exe') -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -WindowStyle Hidden -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw "Uninstall failed: $($uninstall.ExitCode)" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Function-Elite-OpenTKL-windows-x64
          path: dist/installers/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: build-reports
          path: reports/*.json
          if-no-files-found: ignore
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download installer artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download $env:RUN_ID --name Function-Elite-OpenTKL-windows-x64 --dir artifacts
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create $env:RELEASE_TAG artifacts/* --verify-tag --draft --prerelease --generate-notes --title "Function Elite OpenTKL $env:RELEASE_TAG"
